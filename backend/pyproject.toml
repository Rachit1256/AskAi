[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imdq"
version = "1.0.0"
description = "Multi-workbook ingestion, cross-table query and reporting backend for IMD SATMET"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "duckdb>=1.0",
    "pyarrow>=16",
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
fuzzy = ["rapidfuzz>=3.9"]
docx = ["python-docx>=1.1"]
dev = ["pytest>=8.2", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF","BLE"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
