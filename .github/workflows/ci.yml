name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,fuzzy]"
      - name: Tests
        run: pytest -q
      - name: Lint
        run: ruff check src tests
      - name: Types
        run: mypy src/imdq --ignore-missing-imports
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A committed key is how this repository lost a Gemini credential once.
      # This fails the build rather than letting it happen again.
      - name: Reject committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env is tracked. Remove it and rotate the credential."
            exit 1
          fi
          if grep -rIE 'AIza[0-9A-Za-z_-]{30,}|AQ\.[0-9A-Za-z_-]{30,}|sk-[0-9A-Za-z]{20,}' \
               --include='*.env*' --include='*.py' --include='*.js' --include='*.jsx' \
               --include='*.json' --include='*.yml' --include='*.yaml' --include='*.md' . ; then
            echo "::error::An API-key-shaped string is committed. Rotate it and remove it."
            exit 1
          fi
          echo "No key-shaped strings found."
