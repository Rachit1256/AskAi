name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fuzzy]"

      - name: Which storage engine
        run: python -c "import duckdb, sys; print('duckdb', duckdb.__version__); print(sys.version)"

      - name: Tests
        run: pytest -q --tb=short

      # Style and types report but do not block. The code has never been linted;
      # gating the build on it would mask real test failures behind formatting.
      - name: Lint (report only)
        run: ruff check src tests --output-format=concise
        continue-on-error: true

      - name: Types (report only)
        run: mypy src/imdq --ignore-missing-imports
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # npm install, not npm ci: ci requires a committed package-lock.json, and
      # the dependency list changed wholesale in the rebuild. Commit the lockfile
      # and this can become `npm ci` for reproducible builds.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Lint (report only)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env is tracked. Remove it and rotate the credential."
            exit 1
          fi
          if grep -rIE 'AIza[0-9A-Za-z_-]{30,}|AQ\.[0-9A-Za-z_-]{30,}|sk-[0-9A-Za-z]{20,}' \
               --include='*.env*' --include='*.py' --include='*.js' --include='*.jsx' \
               --include='*.json' --include='*.yml' --include='*.yaml' --include='*.md' . ; then
            echo "::error::An API-key-shaped string is committed. Rotate it and remove it."
            exit 1
          fi
          echo "No key-shaped strings found."
